[project]
name = "aerofare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]
[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

